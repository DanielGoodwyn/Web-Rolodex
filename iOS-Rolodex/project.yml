        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Rolodex uses your location to show nearby associations and your current neighborhood."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
