name: Rolodex
options:
  bundleIdPrefix: daniel
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "3YH5RQ572Q"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  Rolodex:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: daniel.rolodex
        INFOPLIST_KEY_CFBundleDisplayName: Rolodex
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Rolodex uses your location to show nearby associations and your current neighborhood."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Rolodex uses your location to show nearby associations and your current neighborhood."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: daniel.rolodex
            CFBundleURLSchemes:
              - rolodex-app
