name: Rolodex
options:
  bundleIdPrefix: com.danielgoodwyn
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  Rolodex:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielgoodwyn.rolodex
        INFOPLIST_KEY_CFBundleDisplayName: Rolodex
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Rolodex uses your location to show nearby associations and your current neighborhood."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Rolodex uses your location to show nearby associations and your current neighborhood."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.danielgoodwyn.rolodex
            CFBundleURLSchemes:
              - rolodex-app
